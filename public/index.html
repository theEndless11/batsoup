<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="chatbox-container">
        <!-- Category Tabs -->
        <div id="category-tabs">
            <button class="tab-btn">General</button>
            <button class="tab-btn"><a href=Private.html>Priavte</a></button>
        </div>

        <!-- Chat Box -->
        <div id="chatbox">
            <div id="messages-container"></div>

            <!-- Message Input Area -->
            <div id="message-input">
                <input type="text" id="user-message" placeholder="Type your message..." />
                <button id="send-message-btn">Send</button>
            </div>
            <!-- File Upload (hidden) -->
            <input type="file" id="file-input" style="display:none" />

            <!-- Options for sending media -->
            <div id="options-container">
                <button class="option-btn" id="send-file-btn">file</button>
            </div>
            <script>
              // Handle file input via buttons
            document.getElementById('send-file-btn').addEventListener('click', () => {
              document.getElementById('file-input').click(); // Trigger file input
            });
            
            // Handle the file selection (for image/video/file)
            document.getElementById('file-input').addEventListener('change', (event) => {
              const file = event.target.files[0]; // Get the selected file
              if (file) {
                  console.log('File selected:', file.name);
                  // You can handle the file here, e.g., upload to server
              }
            });
            
            </script>
            <!-- Username Input -->
            <div id="username-container">
                <input type="text" id="username-input" placeholder="Enter username" />
            </div>
        </div>

        <!-- Clear Chat Button -->
        <div id="clear-chat">
            <button id="clear-chat-btn">Clear Chat</button>
        </div>
    </div>

    <script src="https://cdn.ably.io/lib/ably.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let username = '';
            const ably = new Ably.Realtime({ key: 'A2d_-A.1BaGMw:stl13eplJUOlO1UI5slUxDy9S17jg6FaoM9CsWQJYUk' });
            const chatChannel = ably.channels.get('chat-channel');
        
            // Function to display a message
            function displayMessage({ username, message, mediaUrl, timestamp }) {
                const messageElement = document.createElement('div');
                messageElement.className = 'message';
        
                const time = new Date(timestamp).toLocaleTimeString();
                messageElement.innerHTML = `
                    <div class="msg-bubble ${username === 'you' ? 'user-msg' : 'bot-msg'}">
                        <strong>${username}</strong> <span>(${time})</span><br>
                        ${message || ''}
                        ${mediaUrl ? `<br><img src="${mediaUrl}" alt="Media" style="max-width: 100%;">` : ''}
                    </div>
                `;
        
                document.getElementById('messages-container').appendChild(messageElement);
                document.getElementById('messages-container').scrollTop = document.getElementById('messages-container').scrollHeight;
            }
        
            // Fetch messages on load
            async function fetchMessages() {
                try {
                    const response = await fetch('/api/messages');
                    
                    // Check if the response is JSON before parsing
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    
                    const messages = await response.json(); // This will throw an error if the response is not valid JSON
                    messages.forEach(displayMessage);
                } catch (error) {
                    console.error('Error fetching messages:', error);
                    alert('Error fetching messages. Please try again later.');
                }
            }
            
        
            // Listen for new messages from Ably
            chatChannel.subscribe('new-message', (message) => {
                displayMessage(message.data);
            });
        
            // Handle message sending
            document.getElementById('send-message-btn').addEventListener('click', async () => {
                const messageInput = document.getElementById('user-message');
                const fileInput = document.getElementById('file-input');
                const message = messageInput.value.trim();
        
                if (!username) {
                    alert("Please enter a username before sending a message.");
                    return;
                }
        
                if (message || (fileInput && fileInput.files.length > 0)) {
                    let mediaUrl = '';
        
                    // Handle file upload
                    if (fileInput && fileInput.files.length > 0) {
                        const formData = new FormData();
                        formData.append('file', fileInput.files[0]);
        
                        try {
                            const uploadResponse = await fetch('/api/upload', { method: 'POST', body: formData }); // Updated to serverless API
                            const { mediaUrl: uploadedMediaUrl } = await uploadResponse.json();
                            mediaUrl = uploadedMediaUrl;
                        } catch (error) {
                            console.error('Error uploading file:', error);
                            alert('Failed to upload file.');
                            return;
                        }
                    }
        
                    // Send message
                    try {
                        await fetch('/api/send-message', { // Updated to serverless API
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, message, mediaUrl })
                        });
                    } catch (error) {
                        console.error('Error sending message:', error);
                        alert('Failed to send message.');
                    }
        
                    messageInput.value = '';
                    if (fileInput) fileInput.value = ''; // Clear the file input
                } else {
                    alert("Message cannot be empty.");
                }
            });
        
            // Set username
            document.getElementById('username-input').addEventListener('input', (event) => {
                username = event.target.value.trim() || 'you';
            });
        
            // Clear chat
            document.getElementById('clear-chat-btn').addEventListener('click', async () => {
                try {
                    await fetch('/api/messages', { method: 'DELETE' }); // Updated to serverless API
                    document.getElementById('messages-container').innerHTML = '';
                } catch (error) {
                    console.error('Error clearing chat:', error);
                    alert('Failed to clear chat.');
                }
            });
        
            // Initial messages fetch
            fetchMessages();
        });
        
    </script>
</body>

</html>
